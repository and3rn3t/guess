#:schema node_modules/wrangler/config-schema.json

name = "guess"
compatibility_date = "2026-04-01"
pages_build_output_dir = "./dist"

[observability]
enabled = true

[placement]
mode = "smart"

# Local Pages development reads only top-level bindings. Mirror preview here so
# `wrangler pages dev` can serve the mobile app against non-production data.
[vars]
CLOUDFLARE_AI_GATEWAY = "https://gateway.ai.cloudflare.com/v1/362c458c58efc6b65b7005148383403d/andernet-ai-preview/openai/chat/completions"
AUTO_CAPTURE_DQ_SNAPSHOT = "true"
AUTO_DUPLICATES_BACKFILL = "true"
AUTO_DUPLICATES_LIMIT = "40"
AUTO_ENRICH_ONE = "true"
AUTO_RETIRE_ENABLED = "false"
AUTO_RETIRE_LIMIT = "3"
AUTO_RETIRE_MIN_SCORE = "0.9"
AUTO_RETIRE_MIN_SHOWN = "20"
AUTO_RETIRE_WINDOW_DAYS = "30"

[[d1_databases]]
binding = "GUESS_DB"
database_name = "guess-db-preview"
database_id = "a02a0492-36d2-4513-8270-82a3467914de"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "GUESS_IMAGES"
bucket_name = "guess-images"

[[analytics_engine_datasets]]
binding = "LLM_COSTS"
dataset = "llm_costs_preview"

[[analytics_engine_datasets]]
binding = "WORKER_TAIL"
dataset = "worker_tail_preview"

[ai]
binding = "AI"

# Custom domain: andernator.com (configured in Cloudflare Pages dashboard)
# DNS: CNAME andernator.com → guess.pages.dev

# Cloudflare Pages static site deployment
# Build: pnpm build (outputs to dist/)
# Deploy: pnpm run deploy

# ── Production ────────────────────────────────────────────────
[env.production]

[env.production.vars]
# Cloudflare AI Gateway — proxies OpenAI calls with built-in caching,
# rate limiting, logging, cost analytics, and fallbacks.
CLOUDFLARE_AI_GATEWAY = "https://gateway.ai.cloudflare.com/v1/362c458c58efc6b65b7005148383403d/andernet-ai/openai/chat/completions"

# Cron automation defaults (Mission Control backend workflows)
AUTO_CAPTURE_DQ_SNAPSHOT = "true"
AUTO_DUPLICATES_BACKFILL = "true"
AUTO_DUPLICATES_LIMIT = "40"
AUTO_ENRICH_ONE = "true"
AUTO_RETIRE_ENABLED = "false"
AUTO_RETIRE_LIMIT = "3"
AUTO_RETIRE_MIN_SCORE = "0.9"
AUTO_RETIRE_MIN_SHOWN = "20"
AUTO_RETIRE_WINDOW_DAYS = "30"

[[env.production.d1_databases]]
binding = "GUESS_DB"
database_name = "guess-db"
database_id = "1ec6e6bd-56be-4ab6-9d90-09a15243154f"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "GUESS_IMAGES"
bucket_name = "guess-images"

# I.2 — Workers Analytics Engine for LLM cost telemetry. Replaces the
# `costs:{userId}:{date}` KV pattern. The dataset is created the first
# time a data point is written; query in the CF dashboard via SQL.
[[env.production.analytics_engine_datasets]]
binding = "LLM_COSTS"
dataset = "llm_costs"

# I.4 — Tail Worker observability. The `guess-tail` Worker (defined under
# tail-worker/wrangler.toml) receives every main-Worker invocation and
# writes structured rows to the `worker_tail` AE dataset.
#
# IMPORTANT: Pages projects do NOT support `tail_consumers` in wrangler.toml
# (validation error: "Configuration file for Pages projects does not support
# tail_consumers"). Wire the consumer through the Cloudflare dashboard:
#   Pages → guess → Settings → Functions → Tail consumers → Add
#     Service: guess-tail   Environment: production
# Deploy the Tail Worker first: `pnpm deploy:tail`.

# I.4 (inline fallback) — Pages doesn't support tail_consumers today, so
# `functions/_middleware.ts` writes the same observability schema directly
# from the request path. The Tail Worker scaffolding under `tail-worker/`
# stays in the repo for the eventual Pages → Workers migration.
[[env.production.analytics_engine_datasets]]
binding = "WORKER_TAIL"
dataset = "worker_tail"

# B.4 — Workers AI binding for question embeddings (@cf/baai/bge-base-en-v1.5).
# Free tier: 10k neurons/day; embeddings are ~1 neuron each so the question
# bank (~hundreds of rows) backfills in well under the daily quota.
[env.production.ai]
binding = "AI"

# NOTE: RATE_LIMITER Durable Object binding is configured via Cloudflare Pages dashboard.
# The RateLimiter class is defined in functions/_rate-limiter-do.ts and exported in the
# Pages Functions bundle. wrangler 3.52.0+ requires script_name for DO bindings in
# wrangler.toml Pages configs, which is not applicable for co-located Functions DOs.

# ── Preview / Development ─────────────────────────────────────
# Dedicated preview environment so experiments never touch production data
# (D1: guess-db-preview, AE datasets suffixed `_preview`).
[env.preview]

[env.preview.vars]
# Dedicated preview AI Gateway (BX.5/I.1) — keeps preview LLM calls out of
# production cost dashboards and rate-limit buckets.
# ACTION REQUIRED: create the `andernet-ai-preview` gateway in the Cloudflare
# AI Gateway dashboard before first preview deploy. Until then this URL will
# 404 and preview LLM calls will fail loudly (which is preferable to silently
# polluting the prod gateway).
CLOUDFLARE_AI_GATEWAY = "https://gateway.ai.cloudflare.com/v1/362c458c58efc6b65b7005148383403d/andernet-ai-preview/openai/chat/completions"

# Cron automation defaults (preview mirrors production guardrails)
AUTO_CAPTURE_DQ_SNAPSHOT = "true"
AUTO_DUPLICATES_BACKFILL = "true"
AUTO_DUPLICATES_LIMIT = "40"
AUTO_ENRICH_ONE = "true"
AUTO_RETIRE_ENABLED = "false"
AUTO_RETIRE_LIMIT = "3"
AUTO_RETIRE_MIN_SCORE = "0.9"
AUTO_RETIRE_MIN_SHOWN = "20"
AUTO_RETIRE_WINDOW_DAYS = "30"

[[env.preview.d1_databases]]
binding = "GUESS_DB"
database_name = "guess-db-preview"
database_id = "a02a0492-36d2-4513-8270-82a3467914de"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "GUESS_IMAGES"
bucket_name = "guess-images"

# I.2 — separate AE dataset for preview so cost dashboards stay clean.
[[env.preview.analytics_engine_datasets]]
binding = "LLM_COSTS"
dataset = "llm_costs_preview"

# I.4 — Tail Worker for preview. Wire through the CF dashboard
# (Pages → guess → Settings → Functions → Tail consumers, preview env).
# `tail_consumers` is not supported in Pages wrangler.toml.

# I.4 (inline fallback) — preview AE dataset.
[[env.preview.analytics_engine_datasets]]
binding = "WORKER_TAIL"
dataset = "worker_tail_preview"

# B.4 — Workers AI binding for question embeddings (preview env).
[env.preview.ai]
binding = "AI"

# NOTE: RATE_LIMITER DO binding configured via CF dashboard (see production env note above)

