#:schema node_modules/wrangler/config-schema.json

name = "guess"
compatibility_date = "2026-04-01"
pages_build_output_dir = "./dist"

[observability]
enabled = true

[placement]
mode = "smart"

# Custom domain: andernator.com (configured in Cloudflare Pages dashboard)
# DNS: CNAME andernator.com → guess.pages.dev

# Cloudflare Pages static site deployment
# Build: pnpm build (outputs to dist/)
# Deploy: pnpm run deploy

# ── Production ────────────────────────────────────────────────
[env.production]

[env.production.vars]
# Cloudflare AI Gateway — proxies OpenAI calls with built-in caching,
# rate limiting, logging, cost analytics, and fallbacks.
CLOUDFLARE_AI_GATEWAY = "https://gateway.ai.cloudflare.com/v1/362c458c58efc6b65b7005148383403d/andernet-ai/openai/chat/completions"

[[env.production.kv_namespaces]]
binding = "GUESS_KV"
id = "801438ecdbc44c05afd42bf4e764dd78"

[[env.production.d1_databases]]
binding = "GUESS_DB"
database_name = "guess-db"
database_id = "1ec6e6bd-56be-4ab6-9d90-09a15243154f"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "GUESS_IMAGES"
bucket_name = "guess-images"

# I.2 — Workers Analytics Engine for LLM cost telemetry. Replaces the
# `costs:{userId}:{date}` KV pattern. The dataset is created the first
# time a data point is written; query in the CF dashboard via SQL.
[[env.production.analytics_engine_datasets]]
binding = "LLM_COSTS"
dataset = "llm_costs"

# I.4 — Tail Worker observability. The `guess-tail` Worker (defined under
# tail-worker/wrangler.toml) receives every main-Worker invocation and
# writes structured rows to the `worker_tail` AE dataset. Deploy that
# Worker first (`wrangler deploy --config tail-worker/wrangler.toml --env production`)
# before this binding takes effect.
[[env.production.tail_consumers]]
service = "guess-tail"
environment = "production"

# NOTE: RATE_LIMITER Durable Object binding is configured via Cloudflare Pages dashboard.
# The RateLimiter class is defined in functions/_rate-limiter-do.ts and exported in the
# Pages Functions bundle. wrangler 3.52.0+ requires script_name for DO bindings in
# wrangler.toml Pages configs, which is not applicable for co-located Functions DOs.

# ── Preview / Development ─────────────────────────────────────
# Isolated KV so preview experiments never touch production data.
[env.preview]

[env.preview.vars]
# Dedicated preview AI Gateway (BX.5/I.1) — keeps preview LLM calls out of
# production cost dashboards and rate-limit buckets.
# ACTION REQUIRED: create the `andernet-ai-preview` gateway in the Cloudflare
# AI Gateway dashboard before first preview deploy. Until then this URL will
# 404 and preview LLM calls will fail loudly (which is preferable to silently
# polluting the prod gateway).
CLOUDFLARE_AI_GATEWAY = "https://gateway.ai.cloudflare.com/v1/362c458c58efc6b65b7005148383403d/andernet-ai-preview/openai/chat/completions"

[[env.preview.kv_namespaces]]
binding = "GUESS_KV"
id = "96c1143288174dd5891e344a46e565c6"

[[env.preview.d1_databases]]
binding = "GUESS_DB"
database_name = "guess-db-preview"
database_id = "a02a0492-36d2-4513-8270-82a3467914de"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "GUESS_IMAGES"
bucket_name = "guess-images"

# I.2 — separate AE dataset for preview so cost dashboards stay clean.
[[env.preview.analytics_engine_datasets]]
binding = "LLM_COSTS"
dataset = "llm_costs_preview"

# I.4 — Tail Worker for preview deploys. Writes to `worker_tail_preview`.
[[env.preview.tail_consumers]]
service = "guess-tail"
environment = "preview"

# NOTE: RATE_LIMITER DO binding configured via CF dashboard (see production env note above)

