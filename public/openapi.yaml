          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "events": {
                    "type": "array",
                    "maxItems": 50,
                    "items": {
                      "type": "object",
                      "properties": {
                        "id": {
                          "type": "string",
                          "pattern": "^[0-9a-f-]{36}$"
                        },
                        "sessionId": {
                          "type": "string",
                          "pattern": "^[0-9a-f-]{36}$"
                        },
                        "eventType": {
                          "type": "string",
                          "enum": [
                            "game_start",
                            "game_end",
                            "share",
                            "feature_use",
                            "question_skip",
                            "guess_rejected",
                            "server_error",
                            "uncaught_error"
                          ]
                        },
                        "data": {},
                        "clientTs": {
                          "type": "number"
                        }
                      },
                      "required": [
                        "id",
                        "eventType"
                      ],
                      "additionalProperties": false
                    }
                  }
                },
                "required": [
                  "events"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/api/v2/game/answer": {
      "post": {
        "operationId": "post-v2-game-answer",
        "summary": "Submit an answer for the current question",
        "tags": [
          "v2",
          "game"
        ],
        "responses": {
          "200": {
            "description": "Success response",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "question"
                        },
                        "question": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string"
