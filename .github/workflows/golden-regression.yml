name: Golden Regression Gate (DQ.1)

on:
  push:
    branches: [main]
    paths:
      - "data/data-quality-golden.json"
      - "data/enrich-cache/attribute_definitions.json"
      - "scripts/ingest/enrich.ts"
      - "scripts/golden-regression.ts"
      - ".github/workflows/golden-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/data-quality-golden.json"
      - "data/enrich-cache/attribute_definitions.json"
      - "scripts/ingest/enrich.ts"
      - "scripts/golden-regression.ts"
      - ".github/workflows/golden-regression.yml"
  workflow_dispatch:

concurrency:
  group: golden-regression-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  schema:
    name: Validate golden set schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Prepare schema artifacts
        run: mkdir -p .ci-artifacts/golden/schema
      - name: Schema-only check (no LLM)
        run: |
          set -o pipefail
          pnpm golden:check 2>&1 | tee .ci-artifacts/golden/schema/schema-check.log
      - name: Upload schema logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-schema-logs
          path: .ci-artifacts/golden/schema/
          if-no-files-found: ignore
          retention-days: 7

  llm-regression:
    name: LLM regression (≤3% deviation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: schema
    # Only run when the OpenAI key is available — forks and dependabot PRs skip.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Prepare llm artifacts
        run: mkdir -p .ci-artifacts/golden/llm

      - name: Verify OPENAI_API_KEY secret exists
        uses: ./.github/actions/verify-secrets
        with:
          names: OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run golden regression
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          pnpm golden:regression --json golden-report.json 2>&1 | tee .ci-artifacts/golden/llm/golden-regression.log

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-regression-report
          path: golden-report.json
          if-no-files-found: ignore
      - name: Upload llm logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-llm-logs
          path: .ci-artifacts/golden/llm/
          if-no-files-found: ignore
          retention-days: 7
