name: Engine self-tune

# Weekly job that:
#  1. Searches a small ±10% grid around the current active scoring weights
#     for an improvement against last week's CONTROL games (Bayesian replay).
#  2. If improvement > 0.5%, writes the candidate to engine_config key
#     ab:experiment-weights and bumps ab:experiment-pct to 10% so the
#     candidate is A/B-tested against control before any promotion.
#  3. Independently evaluates last week's existing experiment vs control. If
#     win-rate ≥ control + 1σ over ≥500 games per arm, promotes the candidate
#     weights to engine_config key engine:weights-active.
#
# Both steps respect the engine:auto-tune-enabled kill switch — when the
# value is anything other than "true" the engine ignores the active weights
# even after promotion. Promotion still happens; the switch is the runtime
# gate.

on:
  schedule:
    # Sundays 04:00 UTC. After the daily aggregator and well clear of peak
    # traffic windows.
    - cron: '0 5 * * 0' # Sunday 05:00 UTC — after corroborate (was 04:00, collided with corroborate)
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      days:
        description: 'Window in days'
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  self-tune:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup

      - name: Prepare self-tune artifacts
        run: |
          mkdir -p .ci-artifacts/engine-self-tune
          {
            echo "env=${{ github.event.inputs.env || 'production' }}"
            echo "days=${{ github.event.inputs.days || '7' }}"
            echo "sha=${{ github.sha }}"
          } > .ci-artifacts/engine-self-tune/metadata.txt

      - name: Run self-tune grid search
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          ENV_FLAG="${{ github.event.inputs.env || 'production' }}"
          DAYS="${{ github.event.inputs.days || '7' }}"
          npx tsx scripts/self-tune-weights.ts --env "$ENV_FLAG" --days "$DAYS" \
            2>&1 | tee .ci-artifacts/engine-self-tune/self-tune.log

      - name: Upload candidate weights to D1 engine_config
        if: hashFiles('data/self-tune/weights-candidate.json') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          ENV_FLAG="${{ github.event.inputs.env || 'production' }}"
          DB_NAME=$([ "$ENV_FLAG" = "production" ] && echo "guess-db" || echo "guess-db-preview")
          ACTION=$(jq -r '.action' data/self-tune/summary.json)
          if [ "$ACTION" = "propose" ]; then
            VAL=$(jq -c '.' data/self-tune/weights-candidate.json)
            ESCAPED=$(printf '%s' "$VAL" | sed "s/'/''/g")
            echo "INSERT OR REPLACE INTO engine_config (key, value, updated_at) VALUES ('ab:experiment-weights', '${ESCAPED}', unixepoch());" > /tmp/self-tune-weights.sql
            pnpm wrangler d1 execute "$DB_NAME" --env "$ENV_FLAG" --remote --file /tmp/self-tune-weights.sql
            # Bump rollout to 10% if currently at 0
            CURRENT_PCT=$(pnpm wrangler d1 execute "$DB_NAME" --env "$ENV_FLAG" --remote --command "SELECT value FROM engine_config WHERE key = 'ab:experiment-pct'" --json 2>/dev/null | jq -r '.[0].results[0].value // "0"')
            if [ "${CURRENT_PCT:-0}" -lt 10 ]; then
              pnpm wrangler d1 execute "$DB_NAME" --env "$ENV_FLAG" --remote --command "INSERT OR REPLACE INTO engine_config (key, value, updated_at) VALUES ('ab:experiment-pct', '10', unixepoch())"
            fi
          else
            echo "Self-tune action=$ACTION — no candidate written"
          fi

      - name: Run promotion gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          ENV_FLAG="${{ github.event.inputs.env || 'production' }}"
          DAYS="${{ github.event.inputs.days || '7' }}"
          npx tsx scripts/promote-experiment.ts --env "$ENV_FLAG" --days "$DAYS" \
            2>&1 | tee .ci-artifacts/engine-self-tune/promote.log

      - name: Promote weights to engine:weights-active
        if: hashFiles('data/promotion/weights-active.json') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          ENV_FLAG="${{ github.event.inputs.env || 'production' }}"
          DB_NAME=$([ "$ENV_FLAG" = "production" ] && echo "guess-db" || echo "guess-db-preview")
          VAL=$(jq -c '.' data/promotion/weights-active.json)
          ESCAPED=$(printf '%s' "$VAL" | sed "s/'/''/g")
          echo "INSERT OR REPLACE INTO engine_config (key, value, updated_at) VALUES ('engine:weights-active', '${ESCAPED}', unixepoch());" > /tmp/promote-weights.sql
          pnpm wrangler d1 execute "$DB_NAME" --env "$ENV_FLAG" --remote --file /tmp/promote-weights.sql
          # Reset experiment back to 0% — the candidate is now control.
          pnpm wrangler d1 execute "$DB_NAME" --env "$ENV_FLAG" --remote --command "INSERT OR REPLACE INTO engine_config (key, value, updated_at) VALUES ('ab:experiment-pct', '0', unixepoch())"

      - name: Collect output artifacts
        if: always()
        run: |
          cp -f data/self-tune/summary.json .ci-artifacts/engine-self-tune/self-tune-summary.json 2>/dev/null || true
          cp -f data/promotion/summary.json .ci-artifacts/engine-self-tune/promotion-summary.json 2>/dev/null || true

      - name: Upload self-tune artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engine-self-tune-artifacts
          path: .ci-artifacts/engine-self-tune/
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Engine Self-Tune"
            echo ""
            echo "- Artifact: engine-self-tune-artifacts"
            echo "- Files: metadata.txt, self-tune.log, promote.log, self-tune-summary.json, promotion-summary.json"
            echo ""
            if [ -f data/self-tune/summary.json ]; then
              echo "#### Self-tune result"
              echo '```json'
              cat data/self-tune/summary.json
              echo '```'
            else
              echo "_No self-tune summary written_"
            fi
            echo ""
            if [ -f data/promotion/summary.json ]; then
              echo "#### Promotion result"
              echo '```json'
              cat data/promotion/summary.json
              echo '```'
            else
              echo "_No promotion summary written_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
