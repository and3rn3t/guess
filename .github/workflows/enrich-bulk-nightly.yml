name: Nightly bulk character enrichment

# Processes unenriched characters (no `character_attributes` rows) in
# production D1, working through the backlog highest-popularity-first.
#
# Unlike the admin-dashboard pipeline (CF Worker self-chaining, ~30s/char
# wall-clock limit), this script runs directly in GH Actions with no
# time constraint, batching N characters per OpenAI call and processing
# multiple batches in parallel.
#
# Throughput (defaults: limit=800, batch-size=5, concurrency=3, attr-chunks=4):
#   3 concurrent batches × 5 chars × 4 attr-chunks ≈ 90-150 chars/min
#   → variable runtime; graceful cutoff at --max-minutes preserves partial progress
#   → ~$0.08/night at gpt-4o-mini rates
#
# Lives in GH Actions (not the H.3 Cron Worker) because:
#   1. Workers waitUntil() is hard-capped at ~30 s — insufficient for bulk work.
#   2. The OpenAI key is not wired into the CF Worker environment.

on:
  schedule:
    # Three times daily: 01:00, 07:00, and 13:00 UTC.
    # Two hours of separation keeps wrangler API calls from contending.
    # 2 000 chars × 3 runs = 6 000 chars/day (with graceful cutoff safety).
    - cron: '0 1 * * *'
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      limit:
        description: 'Max characters to enrich this run'
        required: false
        default: '2000'
      batch_size:
        description: 'Characters per LLM call'
        required: false
        default: '5'
      concurrency:
        description: 'Parallel LLM batches'
        required: false
        default: '8'
      attr_chunks:
        description: 'Attribute partitions per batch (mirrors server-side chunking)'
        required: false
        default: '4'
      flush_every:
        description: 'Apply results to D1 every N chars (preserves partial progress on failure)'
        required: false
        default: '50'
      max_minutes:
        description: 'Stop claiming new batches after N minutes and flush progress'
        required: false
        default: '50'
      dry_run:
        description: 'Dry run (skip OpenAI + D1 write)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      model:
        description: 'OpenAI model override (empty = script default)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: enrich-bulk-${{ github.event.inputs.env || 'production' }}
  cancel-in-progress: false

jobs:
  bulk-enrich:
    runs-on: ubuntu-latest
    # Keep a hard cap, but leave margin for artifact upload and post-steps.
    timeout-minutes: 75
    if: ${{ github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Prepare bulk-enrich artifacts
        run: mkdir -p .ci-artifacts/bulk-enrich

      - name: Verify required secrets exist
        uses: ./.github/actions/verify-secrets
        with:
          names: OPENAI_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run bulk enrichment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BULK_ENRICH_MODEL: ${{ github.event.inputs.model || '' }}
        run: |
          set -o pipefail
          ENV_FLAG="${{ github.event.inputs.env || 'production' }}"
          LIMIT="${{ github.event.inputs.limit || '2000' }}"
          BATCH_SIZE="${{ github.event.inputs.batch_size || '5' }}"
          CONCURRENCY="${{ github.event.inputs.concurrency || '8' }}"
          ATTR_CHUNKS="${{ github.event.inputs.attr_chunks || '4' }}"
          FLUSH_EVERY="${{ github.event.inputs.flush_every || '50' }}"
          MAX_MINUTES="${{ github.event.inputs.max_minutes || '50' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          {
            echo "env=$ENV_FLAG"
            echo "limit=$LIMIT"
            echo "batch_size=$BATCH_SIZE"
            echo "concurrency=$CONCURRENCY"
            echo "attr_chunks=$ATTR_CHUNKS"
            echo "flush_every=$FLUSH_EVERY"
            echo "max_minutes=$MAX_MINUTES"
            echo "dry_run=${{ github.event.inputs.dry_run || 'false' }}"
            echo "model=${{ github.event.inputs.model || '' }}"
            echo "sha=${{ github.sha }}"
          } > .ci-artifacts/bulk-enrich/metadata.txt
          pnpm exec tsx scripts/bulk-enrich-characters.ts \
            --env "$ENV_FLAG" \
            --limit "$LIMIT" \
            --batch-size "$BATCH_SIZE" \
            --concurrency "$CONCURRENCY" \
            --attr-chunks "$ATTR_CHUNKS" \
            --flush-every "$FLUSH_EVERY" \
            --max-minutes "$MAX_MINUTES" \
            $DRY_RUN_FLAG \
            | tee .ci-artifacts/bulk-enrich/bulk-enrich-output.log

      - name: Upload enrichment SQL artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bulk-enrich-sql
          path: data/bulk-enrich/*.sql
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bulk-enrich-log
          path: .ci-artifacts/bulk-enrich/bulk-enrich-output.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload bulk-enrich metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bulk-enrich-metadata
          path: .ci-artifacts/bulk-enrich/metadata.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Bulk-enrich summary
        if: always()
        run: |
          {
            echo "### Bulk Enrichment Results"
            echo ""
            if [ -f .ci-artifacts/bulk-enrich/bulk-enrich-output.log ]; then
              SUMMARY=$(grep '\[bulk-enrich\] SUMMARY' .ci-artifacts/bulk-enrich/bulk-enrich-output.log | tail -1 || true)
              if [ -n "$SUMMARY" ]; then
                echo "**$SUMMARY**"
              else
                echo "- Artifact: bulk-enrich-log (see for details)"
              fi
            fi
            echo ""
            echo "- Artifact: bulk-enrich-sql"
            echo "- Artifact: bulk-enrich-log"
            echo "- Artifact: bulk-enrich-metadata"
          } >> "$GITHUB_STEP_SUMMARY"
