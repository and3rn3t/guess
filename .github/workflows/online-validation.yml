name: Online Validation

on:
  workflow_dispatch:
    inputs:
      enforce:
        description: 'Fail if completeness gate fails (true) or warn-only (false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "data/attribute-completeness-sla.json"
      - "functions/api/_data_completeness.ts"
      - "scripts/validate-online.ts"
      - "scripts/data-quality/check-sla.ts"
      - "scripts/data-quality/compute-completeness.ts"
      - "scripts/vision-validate.ts"
      - ".github/workflows/online-validation.yml"
      - ".github/workflows/vision-validate.yml"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "migrations/**"
      - "data/attribute-completeness-sla.json"
      - "functions/api/_data_completeness.ts"
      - "scripts/validate-online.ts"
      - "scripts/data-quality/check-sla.ts"
      - "scripts/data-quality/compute-completeness.ts"
      - "scripts/vision-validate.ts"
      - ".github/workflows/online-validation.yml"
      - ".github/workflows/vision-validate.yml"
      - "package.json"

concurrency:
  group: online-validation-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-online:
    name: Validate online checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DQ_COMPLETENESS_ENFORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enforce || 'false' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Prepare online-validation artifacts
        run: mkdir -p .ci-artifacts/online-validation

      - name: Run online validation lane
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          pnpm validate:online 2>&1 | tee .ci-artifacts/online-validation/validate-online.log

      - name: Data completeness gate (enforce)
        if: env.DQ_COMPLETENESS_ENFORCE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm dq:sla:check 2>&1 | tee .ci-artifacts/online-validation/dq-sla-check.log
          pnpm dq:completeness:ci:fail 2>&1 | tee .ci-artifacts/online-validation/dq-completeness.log

      # Warn-only rollout: collect production completeness signal before blocking merges.
      - name: Data completeness gate (warn-only)
        if: env.DQ_COMPLETENESS_ENFORCE != 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm dq:sla:check 2>&1 | tee .ci-artifacts/online-validation/dq-sla-check.log
          pnpm dq:completeness:ci:warn 2>&1 | tee .ci-artifacts/online-validation/dq-completeness.log

      - name: Upload online-validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-online-validation-logs
          path: .ci-artifacts/online-validation/
          retention-days: 7

      - name: Online validation summary
        if: always()
        run: |
          {
            echo "### Online Validation Artifacts"
            echo ""
            echo "- Artifact: ci-online-validation-logs"
            echo "- Files: validate-online.log, dq-sla-check.log, dq-completeness.log"
            echo "- Rollout mode: ${{ env.DQ_COMPLETENESS_ENFORCE == 'true' && 'enforce' || 'warn-only' }}"
            echo "- Toggle: set DQ_COMPLETENESS_ENFORCE='true' in this workflow to enforce"
          } >> "$GITHUB_STEP_SUMMARY"
