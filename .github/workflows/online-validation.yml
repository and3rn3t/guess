name: Online Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "scripts/validate-online.ts"
      - "scripts/vision-validate.ts"
      - ".github/workflows/online-validation.yml"
      - ".github/workflows/vision-validate.yml"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "migrations/**"
      - "scripts/validate-online.ts"
      - "scripts/vision-validate.ts"
      - ".github/workflows/online-validation.yml"
      - ".github/workflows/vision-validate.yml"
      - "package.json"

concurrency:
  group: online-validation-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-online:
    name: Validate online checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Prepare online-validation artifacts
        run: mkdir -p .ci-artifacts/online-validation

      - name: Run online validation lane
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          pnpm validate:online 2>&1 | tee .ci-artifacts/online-validation/validate-online.log

      - name: Upload online-validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-online-validation-logs
          path: .ci-artifacts/online-validation/
          retention-days: 7

      - name: Online validation summary
        if: always()
        run: |
          {
            echo "### Online Validation Artifacts"
            echo ""
            echo "- Artifact: ci-online-validation-logs"
            echo "- File: validate-online.log"
            echo "- Behavior: checks run when credentials are present; otherwise they are skipped"
          } >> "$GITHUB_STEP_SUMMARY"
