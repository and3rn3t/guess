name: Adaptive Data Refresh

# Refreshes simulation-derived adaptive data in production D1 kv_cache:
#   kv:attribute-maybe-rates     — per-attribute maybe-answer rates
#   kv:attribute-net-gains       — per-attribute average information gain
#   kv:confusion-discriminators  — discriminating questions for confused character pairs
#
# Runs weekly (Sunday 02:00 UTC) and on-demand via workflow_dispatch.
# Requires secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  schedule:
    - cron: "0 2 * * 0" # Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      sample:
        description: "Games per difficulty (default: 100)"
        required: false
        default: "100"

concurrency:
  group: adaptive-data-refresh
  cancel-in-progress: true # only one refresh at a time

permissions: {}

env:
  WRANGLER_VERSION: "4.83.0"

jobs:
  # ── 1. Export character + question data from production D1 ──
  export:
    name: Export simulation data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Prepare export diagnostics
        run: mkdir -p .ci-artifacts/adaptive/export
      - name: Export from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm simulate:export --env production 2>&1 | tee .ci-artifacts/adaptive/export/export.log
      - name: Record export metadata
        run: |
          {
            echo "env=production"
            echo "sample=${{ github.event.inputs.sample || '100' }}"
            echo "sha=${{ github.sha }}"
          } > .ci-artifacts/adaptive/export/metadata.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sim-data
          path: |
            scripts/simulate/data/characters.json
            scripts/simulate/data/questions.json
          retention-days: 1
      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: adaptive-export-diagnostics
          path: .ci-artifacts/adaptive/export/
          retention-days: 14

  # ── 2. Run simulations in parallel across all three difficulties
  simulate:
    name: Simulate (${{ matrix.difficulty }})
    needs: [ export ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        difficulty: [ easy, medium, hard ]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Prepare simulate diagnostics
        run: mkdir -p .ci-artifacts/adaptive/simulate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sim-data
          path: scripts/simulate/data
      - name: Run simulations
        run: |
          set -o pipefail
          SAMPLE=${{ github.event.inputs.sample || '100' }}
          {
            echo "difficulty=${{ matrix.difficulty }}"
            echo "sample=$SAMPLE"
            echo "sha=${{ github.sha }}"
          } > .ci-artifacts/adaptive/simulate/metadata-${{ matrix.difficulty }}.txt
          pnpm simulate \
            --sample "$SAMPLE" \
            --difficulty ${{ matrix.difficulty }} \
            --parallel \
            --output scripts/simulate/data/results-ci-${{ matrix.difficulty }}.jsonl 2>&1 | tee .ci-artifacts/adaptive/simulate/simulate-${{ matrix.difficulty }}.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sim-results-${{ matrix.difficulty }}
          path: scripts/simulate/data/results-ci-${{ matrix.difficulty }}.jsonl
          retention-days: 1
      - name: Upload simulate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: adaptive-simulate-diagnostics-${{ matrix.difficulty }}
          path: |
            .ci-artifacts/adaptive/simulate/simulate-${{ matrix.difficulty }}.log
            .ci-artifacts/adaptive/simulate/metadata-${{ matrix.difficulty }}.txt
          retention-days: 14

  # ── 3. Merge results, compute adaptive data, upload to D1 kv_cache ────
  compute-and-upload:
    name: Compute adaptive data + upload to D1
    needs: [ simulate ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Prepare compute diagnostics
        run: mkdir -p .ci-artifacts/adaptive/compute

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sim-results-easy
          path: scripts/simulate/data
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sim-results-medium
          path: scripts/simulate/data
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sim-results-hard
          path: scripts/simulate/data

      - name: Merge simulation results
        run: |
          set -o pipefail
          cat \
            scripts/simulate/data/results-ci-easy.jsonl \
            scripts/simulate/data/results-ci-medium.jsonl \
            scripts/simulate/data/results-ci-hard.jsonl \
          > scripts/simulate/data/results-ci-all.jsonl
          TOTAL=$(wc -l < scripts/simulate/data/results-ci-all.jsonl)
          echo "Total games: ${TOTAL}"
          echo "Total games: ${TOTAL}" > .ci-artifacts/adaptive/compute/merge.log

      - name: Compute maybe-rates
        run: |
          set -o pipefail
          pnpm simulate:maybe-rates --input "$PWD/scripts/simulate/data/results-ci-all.jsonl" 2>&1 | tee .ci-artifacts/adaptive/compute/maybe-rates.log

      - name: Compute net-gains
        run: |
          set -o pipefail
          pnpm simulate:net-gains --input "$PWD/scripts/simulate/data/results-ci-all.jsonl" 2>&1 | tee .ci-artifacts/adaptive/compute/net-gains.log

      - name: Compute confusion-discriminators
        run: |
          set -o pipefail
          pnpm simulate:confusion-pairs --input "$PWD/scripts/simulate/data/results-ci-all.jsonl" 2>&1 | tee .ci-artifacts/adaptive/compute/confusion-discriminators.log

      - name: Upload maybe-rates to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          VAL=$(jq -c '.' scripts/simulate/data/maybe-rates.json)
          ESCAPED=$(printf '%s' "$VAL" | sed "s/'/''/g")
          echo "INSERT OR REPLACE INTO kv_cache (key, value, cached_at) VALUES ('kv:attribute-maybe-rates', '${ESCAPED}', unixepoch());" > /tmp/kv-upsert-maybe-rates.sql
          pnpm wrangler d1 execute guess-db --env production --remote --file /tmp/kv-upsert-maybe-rates.sql 2>&1 | tee .ci-artifacts/adaptive/compute/d1-maybe-rates.log

      - name: Upload net-gains to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          VAL=$(jq -c '.' scripts/simulate/data/net-gains.json)
          ESCAPED=$(printf '%s' "$VAL" | sed "s/'/''/g")
          echo "INSERT OR REPLACE INTO kv_cache (key, value, cached_at) VALUES ('kv:attribute-net-gains', '${ESCAPED}', unixepoch());" > /tmp/kv-upsert-net-gains.sql
          pnpm wrangler d1 execute guess-db --env production --remote --file /tmp/kv-upsert-net-gains.sql 2>&1 | tee .ci-artifacts/adaptive/compute/d1-net-gains.log

      - name: Upload confusion-discriminators to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          VAL=$(jq -c '.' scripts/simulate/data/confusion-discriminators.json)
          ESCAPED=$(printf '%s' "$VAL" | sed "s/'/''/g")
          echo "INSERT OR REPLACE INTO kv_cache (key, value, cached_at) VALUES ('kv:confusion-discriminators', '${ESCAPED}', unixepoch());" > /tmp/kv-upsert-confusion.sql
          pnpm wrangler d1 execute guess-db --env production --remote --file /tmp/kv-upsert-confusion.sql 2>&1 | tee .ci-artifacts/adaptive/compute/d1-confusion-discriminators.log

      - name: Print summary
        run: |
          {
            echo "### Adaptive Data Refresh"
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
            for f in maybe-rates net-gains confusion-discriminators; do
              SIZE=$(wc -c < "scripts/simulate/data/${f}.json")
              echo "| ${f}.json | ${SIZE} bytes |"
            done
            echo ""
            echo "Uploaded to: \`kv_cache\` table keys \`kv:attribute-maybe-rates\`, \`kv:attribute-net-gains\`, \`kv:confusion-discriminators\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compute diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: adaptive-compute-diagnostics
          path: |
            .ci-artifacts/adaptive/compute/
            scripts/simulate/data/maybe-rates.json
            scripts/simulate/data/net-gains.json
            scripts/simulate/data/confusion-discriminators.json
          if-no-files-found: ignore
          retention-days: 14
