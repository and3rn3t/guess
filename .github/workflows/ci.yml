name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: &paths-ignore
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".husky/**"
  pull_request:
    branches: [main]
    paths-ignore: *paths-ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Detect which parts of the codebase changed ─────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app == 'true' || github.event_name == 'workflow_dispatch' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
      db: ${{ steps.filter.outputs.db == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            app:
              - 'apps/**'
              - 'src/**'
              - 'functions/**'
              - 'packages/**'
              - 'scripts/**'
              - 'docs/openapi*'
              - 'public/openapi.yaml'
              - 'public/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tailwind.config.js'
              - 'components.json'
              - 'wrangler.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/action.yml'
              - '.github/actions/smoke-test-url/action.yml'
              - '.github/actions/verify-secrets/action.yml'
            frontend:
              - 'apps/**'
              - 'src/**'
              - 'packages/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tailwind.config.js'
              - 'components.json'
            db:
              - 'migrations/**'
              - 'functions/api/_db-types.ts'
              - 'scripts/generate-db-types.ts'

  # ── Static checks: lint + type-check + OpenAPI (parallel to checks-tests) ──
  checks-static:
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Prepare checks-static artifacts
        run: mkdir -p .ci-artifacts/checks-static
      - name: Lint
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee .ci-artifacts/checks-static/lint.log
      - name: Type check
        run: |
          set -o pipefail
          pnpm typecheck:all 2>&1 | tee .ci-artifacts/checks-static/typecheck.log
      - name: Data quality SLA contract
        run: |
          set -o pipefail
          pnpm dq:sla:check 2>&1 | tee .ci-artifacts/checks-static/dq-sla-check.log
      - name: Mobile native-boundary guardrails
        run: |
          set -o pipefail
          pnpm mobile:guardrails 2>&1 | tee .ci-artifacts/checks-static/mobile-guardrails.log
      - name: OpenAPI generate + validate + drift check
        run: |
          set -o pipefail
          pnpm openapi:generate 2>&1 | tee .ci-artifacts/checks-static/openapi-generate.log
          pnpm openapi:validate 2>&1 | tee .ci-artifacts/checks-static/openapi-validate.log
          pnpm openapi:check 2>&1 | tee .ci-artifacts/checks-static/openapi-check.log
      - name: Upload checks-static logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-checks-static-logs
          path: .ci-artifacts/checks-static/
          retention-days: 7
      - name: Checks-static summary
        if: always()
        run: |
          {
            echo "### Checks-Static Artifacts"
            echo ""
            echo "- Artifact: ci-checks-static-logs"
            echo "- Files: lint.log, typecheck.log, dq-sla-check.log, mobile-guardrails.log, openapi-generate.log, openapi-validate.log, openapi-check.log"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Test coverage (parallel to checks-static) ───────────────
  checks-tests:
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Prepare checks-tests artifacts
        run: mkdir -p .ci-artifacts/checks-tests
      - name: Test coverage
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee .ci-artifacts/checks-tests/test-coverage.log
      - name: Coverage diff PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b # v2
      - name: Upload checks-tests logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-checks-tests-logs
          path: .ci-artifacts/checks-tests/
          retention-days: 7
      - name: Checks-tests summary
        if: always()
        run: |
          {
            echo "### Checks-Tests Artifacts"
            echo ""
            echo "- Artifact: ci-checks-tests-logs"
            echo "- Files: test-coverage.log"
          } >> "$GITHUB_STEP_SUMMARY"

  test-e2e:
    needs: [changes, build]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium firefox
      - run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Cache Vite build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: node_modules/.vite
          key: vite-build-${{ hashFiles('src/**', 'packages/**', 'vite.config.ts', 'pnpm-lock.yaml') }}
          restore-keys: |
            vite-build-
      - name: Prepare build artifacts
        run: mkdir -p .ci-artifacts/build
      - name: Build app
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee .ci-artifacts/build/build.log

      - name: Build worker (dry-run)
        run: |
          set -o pipefail
          pnpm build:worker 2>&1 | tee .ci-artifacts/build/worker-build.log

      - name: Check bundle size
        run: |
          set -o pipefail
          MAX_KB=600
          LARGEST=$(find dist/assets -name '*.js' -exec du -k {} + | awk 'BEGIN { max = 0 } { if ($1 > max) max = $1 } END { print max }')
          echo "Largest JS chunk: ${LARGEST}KB (limit: ${MAX_KB}KB)"
          echo "Largest JS chunk: ${LARGEST}KB (limit: ${MAX_KB}KB)" > .ci-artifacts/build/bundle-size.log
          if [ "$LARGEST" -gt "$MAX_KB" ]; then
            echo "::error::Bundle size ${LARGEST}KB exceeds ${MAX_KB}KB limit"
            exit 1
          fi

      - name: Check named chunk budgets
        run: |
          set -o pipefail
          pnpm size 2>&1 | tee .ci-artifacts/build/named-chunk-budgets.log

      - name: Record built asset sizes
        run: |
          find dist/assets -type f -name '*.js' -exec du -k {} + | sort -rn > .ci-artifacts/build/js-asset-sizes-kb.txt
          find dist/assets -type f -name '*.css' -exec du -k {} + | sort -rn > .ci-artifacts/build/css-asset-sizes-kb.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 3
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-build-logs
          path: .ci-artifacts/build/
          retention-days: 7
      - name: Build summary
        if: always()
        run: |
          {
            echo "### Build Artifacts"
            echo ""
            echo "- Artifact: dist"
            echo "- Artifact: ci-build-logs"
            echo "- Files: build.log, worker-build.log, bundle-size.log, named-chunk-budgets.log, js-asset-sizes-kb.txt, css-asset-sizes-kb.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── DB checks: type drift + migration idempotency ──────────
  db-checks:
    needs: [changes]
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Prepare db-checks artifacts
        run: mkdir -p .ci-artifacts/db-checks
      - name: Regenerate DB types
        run: |
          set -o pipefail
          pnpm db:types 2>&1 | tee .ci-artifacts/db-checks/db-types.log
      - name: Check for drift
        run: |
          set -o pipefail
          if ! git diff --exit-code functions/api/_db-types.ts; then
            echo "::error::Generated DB types (functions/api/_db-types.ts) are out of sync with the schema. Run 'pnpm db:types' and commit the result."
            exit 1
          fi
          echo "No DB type drift detected." > .ci-artifacts/db-checks/db-drift.log
      - name: Validate migration idempotency
        run: |
          set -o pipefail
          pnpm migrate:validate 2>&1 | tee .ci-artifacts/db-checks/migrate-validate.log
      - name: D1 migration dry-run (preview)
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        # Applies migrations against a local SQLite instance (--local) to
        # validate SQL parses correctly — catches column drift, CHECK violations,
        # and unparsable SQL. (--dry-run was removed from wrangler; DX.12)
        run: |
          set -o pipefail
          pnpm migrate:dry-run:preview 2>&1 | tee .ci-artifacts/db-checks/migrate-dry-run-preview.log
      - name: Skip D1 migration dry-run (preview)
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: |
          echo "Skipped D1 migration dry-run: missing Cloudflare secrets in this workflow context." \
            | tee .ci-artifacts/db-checks/migrate-dry-run-preview.log
      - name: Upload db-checks logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-db-checks-logs
          path: .ci-artifacts/db-checks/
          retention-days: 7
      - name: DB checks summary
        if: always()
        run: |
          {
            echo "### DB Checks Artifacts"
            echo ""
            echo "- Artifact: ci-db-checks-logs"
            echo "- Files: db-types.log, db-drift.log, migrate-validate.log, migrate-dry-run-preview.log"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Deploy preview (PRs) ────────────────────────────────────
  deploy-preview:
    needs: [checks-static, checks-tests, build, test-e2e]
    if: |
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.checks-static.result == 'success' &&
      needs.checks-tests.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.test-e2e.result == 'success' || needs.test-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # Checkout repo so wrangler can find the sibling `functions/` directory
      # — `pages deploy dist` only ships the static dir; Functions are picked up
      # from `<repo-root>/functions/` at deploy time.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # Full setup (pnpm install) so wrangler in devDependencies is available
      # to `pnpm exec wrangler` used internally by wrangler-action.
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
      - name: Extract PR title
        id: meta
        run: |
          title=$(echo "${{ github.event.pull_request.title }}" | LC_ALL=C tr -cd '[:print:]' | tr -d '"')
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages (preview)
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=guess --branch=${{ github.head_ref }} --commit-message="${{ steps.meta.outputs.title }}"

      - name: Prepare deploy-preview artifacts
        run: mkdir -p .ci-artifacts/deploy-preview

      - name: Record deploy-preview metadata
        run: |
          {
            echo "deployment_url=${{ steps.deploy.outputs.deployment-url }}"
            echo "pr_title=${{ steps.meta.outputs.title }}"
            echo "branch=${{ github.head_ref }}"
            echo "sha=${{ github.sha }}"
          } > .ci-artifacts/deploy-preview/metadata.txt

      - name: Smoke test
        uses: ./.github/actions/smoke-test-url
        with:
          url: ${{ steps.deploy.outputs.deployment-url }}
          retries: "3"
          sleep-seconds: "5"
          require-root: "true"

      - name: Upload deploy-preview artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-deploy-preview-metadata
          path: .ci-artifacts/deploy-preview/
          retention-days: 7

    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}

  # ── Deploy production (push to main) ────────────────────────
  deploy-production:
    needs: [checks-static, checks-tests, build, test-e2e]
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.checks-static.result == 'success' &&
      needs.checks-tests.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.test-e2e.result == 'success' || needs.test-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://guess.andernet.dev
    steps:
      # Checkout repo so wrangler can find the sibling `functions/` directory
      # — `pages deploy dist` only ships the static dir; Functions are picked up
      # from `<repo-root>/functions/` at deploy time.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # Full setup (pnpm install) so wrangler in devDependencies is available
      # to `pnpm exec wrangler` used internally by wrangler-action.
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
      # Extract the commit subject line, strip non-ASCII characters, and strip
      # double quotes. Cloudflare Pages API (code 8000111) rejects multi-byte
      # Unicode. Double quotes break wrangler-action's shell interpolation of
      # --commit-message="..." when the subject itself contains quotes (e.g.
      # "Did you know?"). Both hazards are removed here.
      - name: Extract commit subject
        id: meta
        run: |
          subject=$(git log -1 --pretty=%s | LC_ALL=C tr -cd '[:print:]' | tr -d '"')
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=guess --commit-message="${{ steps.meta.outputs.subject }}"

      - name: Prepare deploy-production artifacts
        run: mkdir -p .ci-artifacts/deploy-production

      - name: Record deploy-production metadata
        run: |
          {
            echo "deployment_url=https://guess.andernet.dev"
            echo "commit_subject=${{ steps.meta.outputs.subject }}"
            echo "sha=${{ github.sha }}"
          } > .ci-artifacts/deploy-production/metadata.txt

      - name: Smoke test
        uses: ./.github/actions/smoke-test-url
        with:
          url: https://guess.andernet.dev
          retries: "5"
          sleep-seconds: "10"
          require-root: "true"
          api-path: /api/v2/stats

      - name: Upload deploy-production artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-deploy-production-metadata
          path: .ci-artifacts/deploy-production/
          retention-days: 7
      - name: Deploy-production summary
        if: always()
        run: |
          {
            echo "### Deploy Production Artifacts"
            echo ""
            echo "- Artifact: ci-deploy-production-metadata"
            echo "- Files: metadata.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── PR report (bundle stats + preview link) ─────────────────
  pr-report:
    needs: [deploy-preview]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-build-logs
          path: ci-build-logs

      - name: Post PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.url }}
        with:
          script: |
            const fs = require('fs');
            const url = process.env.PREVIEW_URL;

            const parseAssetTxt = (file) => {
              try {
                return fs.readFileSync(file, 'utf8').trim().split('\n')
                  .filter(Boolean)
                  .map(l => {
                    const [size, filePath] = l.split('\t');
                    return { size: +size, name: filePath.split('/').pop() };
                  });
              } catch { return []; }
            };

            const jsFiles = parseAssetTxt('ci-build-logs/js-asset-sizes-kb.txt')
              .sort((a, b) => b.size - a.size);
            const cssFiles = parseAssetTxt('ci-build-logs/css-asset-sizes-kb.txt');

            const totalJs = jsFiles.reduce((s, f) => s + f.size, 0);
            const totalCss = cssFiles.reduce((s, f) => s + f.size, 0);

            const breakdown = jsFiles
              .map(f => `| \`${f.name}\` | ${f.size}KB |`).join('\n');

            const body = [
              '## 📦 Deploy Preview',
              '',
              `🔗 **${url}**`,
              '',
              '### Bundle Size',
              '| Metric | Size |',
              '|--------|------|',
              `| Total JS | **${totalJs}KB** |`,
              `| Total CSS | **${totalCss}KB** |`,
              `| Largest chunk | **${jsFiles[0]?.size ?? 0}KB** (limit: 600KB) |`,
              '',
              '<details><summary>JS chunk breakdown</summary>',
              '',
              '| File | Size |',
              '|------|------|',
              breakdown,
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body?.startsWith('## 📦 Deploy Preview'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: PR report summary
        if: always()
        run: |
          {
            echo "### PR Report"
            echo ""
            echo "- Preview URL: ${{ needs.deploy-preview.outputs.url }}"
            echo "- Bundle stats posted as PR comment."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Lighthouse CI (non-blocking) ────────────────────────────
  lighthouse:
    needs: deploy-preview
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: ${{ needs.deploy-preview.outputs.url }}
          uploadArtifacts: true
          temporaryPublicStorage: true
