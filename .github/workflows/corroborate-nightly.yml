name: Player-answer corroboration (DQ.5)

# For every (character, attribute) pair with sufficient player votes, compares
# the player majority to the stored value in `character_attributes`. When the
# majority disagrees above the threshold, files an `attribute_disputes` row
# with `disputed_by='player-corroboration'` so it enters the skeptic-queue
# review surface.
#
# Runs daily at 04:00 UTC — after sparse-fill (02:xx) and reconcile (00:30/01:00)
# so it can corroborate against the freshest attribute data.

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
      limit:
        description: "Max game reveals to process"
        required: false
        default: "500"
      min_votes:
        description: "Minimum player votes per (character, attribute) pair"
        required: false
        default: "2"
      dry_run:
        description: "Dry-run (skip D1 write)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: corroborate-${{ github.event.inputs.env || 'production' }}
  cancel-in-progress: false

jobs:
  corroborate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Prepare corroboration artifacts
        run: mkdir -p .ci-artifacts/corroborate

      - name: Verify required secrets exist
        uses: ./.github/actions/verify-secrets
        with:
          names: CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run player-answer corroboration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          ENV_FLAG="${{ github.event.inputs.env || 'production' }}"
          LIMIT="${{ github.event.inputs.limit || '500' }}"
          MIN_VOTES="${{ github.event.inputs.min_votes || '2' }}"
          DRY_RUN_FLAG="${{ github.event.inputs.dry_run || 'false' }}"

          {
            echo "env=$ENV_FLAG"
            echo "limit=$LIMIT"
            echo "min_votes=$MIN_VOTES"
            echo "dry_run=$DRY_RUN_FLAG"
            echo "sha=${{ github.sha }}"
          } > .ci-artifacts/corroborate/metadata.txt

          EXTRA_FLAGS=""
          if [ "$DRY_RUN_FLAG" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi

          npx tsx scripts/corroborate-player-answers.ts \
            --env "$ENV_FLAG" \
            --limit "$LIMIT" \
            --min-votes "$MIN_VOTES" \
            $EXTRA_FLAGS \
            | tee .ci-artifacts/corroborate/corroborate-output.log

      - name: Upload disputes SQL artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corroboration-disputes-sql
          path: data/corroboration/disputes-*.sql
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corroborate-log
          path: .ci-artifacts/corroborate/corroborate-output.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload corroboration metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corroborate-metadata
          path: .ci-artifacts/corroborate/metadata.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Corroboration summary
        if: always()
        run: |
          {
            echo "### Corroboration Artifacts"
            echo ""
            echo "- Artifact: corroboration-disputes-sql"
            echo "- Artifact: corroborate-log"
            echo "- Artifact: corroborate-metadata"
          } >> "$GITHUB_STEP_SUMMARY"
