name: Nightly sparse-attribute auto-fill (DQ.22)

# Hunts for popular characters with missing attribute values, re-runs the
# canonical enrichment LLM prompt scoped to *just* the missing keys, and
# writes the answers back to character_attributes with an
# `enrichment:openai:<model>:run=<iso>` evidence tag (DQ.28 convention).
#
# Pairs with EN.7 schema drift detection: when DQ.21 admits a brand-new
# attribute, this workflow progressively fills it across the catalog
# starting with the characters players ask about most.
#
# Lives in GH Actions instead of the H.3 Cron Worker because the OpenAI
# key isn't wired into the CF Worker env.

on:
  schedule:
    # Twice daily: 00:45 UTC (after reconcile) and 12:45 UTC.
    # Two runs at 2 000 pairs each fill high-priority (char,attr) gaps faster.
    - cron: '45 0 * * *'
    - cron: '45 12 * * *'
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      budget:
        description: 'Total (char,attr) pairs to fill this run'
        required: false
        default: '2000'
      max_per_char:
        description: 'Per-character cap'
        required: false
        default: '100'
      days:
        description: 'Popularity lookback window (days)'
        required: false
        default: '30'

permissions:
  contents: read

concurrency:
  group: sparse-fill-${{ github.event.inputs.env || 'production' }}
  cancel-in-progress: false

jobs:
  sparse-fill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Prepare sparse-fill artifacts
        run: mkdir -p .ci-artifacts/sparse-fill

      - name: Verify required secrets exist
        uses: ./.github/actions/verify-secrets
        with:
          names: OPENAI_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run nightly sparse-fill
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          ENV_FLAG="${{ github.event.inputs.env || 'production' }}"
          BUDGET="${{ github.event.inputs.budget || '2000' }}"
          MAX_PER_CHAR="${{ github.event.inputs.max_per_char || '100' }}"
          DAYS="${{ github.event.inputs.days || '30' }}"
          {
            echo "env=$ENV_FLAG"
            echo "budget=$BUDGET"
            echo "max_per_char=$MAX_PER_CHAR"
            echo "days=$DAYS"
            echo "sha=${{ github.sha }}"
          } > .ci-artifacts/sparse-fill/metadata.txt
          npx tsx scripts/sparse-fill-attributes.ts \
            --env "$ENV_FLAG" \
            --budget "$BUDGET" \
            --max-per-char "$MAX_PER_CHAR" \
            --days "$DAYS" \
            | tee .ci-artifacts/sparse-fill/sparse-fill-output.log

      - name: Upload fill SQL artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sparse-fill-sql
          path: data/sparse-fill/*.sql
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sparse-fill-log
          path: .ci-artifacts/sparse-fill/sparse-fill-output.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload sparse-fill metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sparse-fill-metadata
          path: .ci-artifacts/sparse-fill/metadata.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Sparse-fill summary
        if: always()
        run: |
          {
            echo "### Sparse Fill Results"
            echo ""
            if [ -f .ci-artifacts/sparse-fill/sparse-fill-output.log ]; then
              SUMMARY=$(grep '\[sparse-fill\] complete:' .ci-artifacts/sparse-fill/sparse-fill-output.log | tail -1 || true)
              if [ -n "$SUMMARY" ]; then
                echo "**$SUMMARY**"
              else
                echo "- Artifact: sparse-fill-log (see for details)"
              fi
            fi
            echo ""
            echo "- Artifact: sparse-fill-sql"
            echo "- Artifact: sparse-fill-log"
            echo "- Artifact: sparse-fill-metadata"
          } >> "$GITHUB_STEP_SUMMARY"
