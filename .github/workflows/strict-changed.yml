name: Strict Validation (Changed Paths)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "functions/**"
      - "packages/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "tail-worker/**"
      - ".github/workflows/strict-changed.yml"

concurrency:
  group: strict-changed-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      strict: ${{ steps.filter.outputs.strict }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            strict:
              - 'src/**'
              - 'functions/**'
              - 'packages/**'
              - 'migrations/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'tail-worker/**'

  strict:
    name: Run strict validation lane
    needs: [changes]
    if: needs.changes.outputs.strict == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRICT_CHANGED_ENFORCE: 'false'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Prepare strict artifacts
        run: mkdir -p .ci-artifacts/strict-changed

      - name: Validate strict (enforce)
        if: env.STRICT_CHANGED_ENFORCE == 'true'
        run: |
          set -o pipefail
          pnpm validate:strict 2>&1 | tee .ci-artifacts/strict-changed/validate-strict.log

      # Warn-only rollout: collect signal first, enforce later.
      - name: Validate strict (warn-only)
        if: env.STRICT_CHANGED_ENFORCE != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm validate:strict 2>&1 | tee .ci-artifacts/strict-changed/validate-strict.log

      - name: Upload strict logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-strict-changed-logs
          path: .ci-artifacts/strict-changed/
          retention-days: 7

      - name: Strict summary
        if: always()
        run: |
          {
            echo "### Strict Changed Artifacts"
            echo ""
            echo "- Artifact: ci-strict-changed-logs"
            echo "- File: validate-strict.log"
            echo "- Rollout mode: ${{ env.STRICT_CHANGED_ENFORCE == 'true' && 'enforce' || 'warn-only' }}"
            echo "- Toggle: set STRICT_CHANGED_ENFORCE='true' in this workflow to enforce"
          } >> "$GITHUB_STEP_SUMMARY"
