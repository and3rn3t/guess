name: Risk-tiered reconciliation (DQ.6/DQ.37)

# Samples N random characters from production D1, re-runs the canonical
# enrichment LLM prompt against them, and appends every attribute-value
# difference to the `attribute_drift` table (migration 0037).
#
# This is the "nightly cron" that DQ.6's acceptance criterion calls for —
# Cloudflare Pages doesn't run cron triggers natively, and even if H.3's
# Cron Worker did, OpenAI calls aren't wired into the Worker env. GitHub
# Actions' scheduler is the practical cron substrate.

on:
  schedule:
    # Tier 1 daily (top played + high disagreement)
    - cron: "30 0 * * *"
    # Tier 2 weekly (Sunday UTC)
    - cron: "0 1 * * 0"
    # Tier 3 monthly (day 1 UTC)
    - cron: "30 1 1 * *"
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
      risk_tier:
        description: "Risk tier"
        required: true
        default: "tier1"
        type: choice
        options:
          - tier1
          - tier2
          - tier3
      sample:
        description: "Sample size (tier sample cap)"
        required: false
        default: ""
      batch_size:
        description: "Characters per LLM call"
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: reconcile-${{ github.event.inputs.env || 'production' }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Prepare reconcile artifacts
        run: mkdir -p .ci-artifacts/reconcile

      - name: Verify required secrets exist
        uses: ./.github/actions/verify-secrets
        with:
          names: OPENAI_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Capture pre-reconcile perf baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          ENV_FLAG="${{ github.event.inputs.env || 'production' }}"

          npx tsx scripts/data-quality/perf-baseline.ts \
            --env "$ENV_FLAG" \
            --out .ci-artifacts/reconcile/perf-baseline-pre.md \
            | tee .ci-artifacts/reconcile/perf-baseline-pre.log

      - name: Run nightly reconciliation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          ENV_FLAG="${{ github.event.inputs.env || 'production' }}"
          SCHEDULE="${{ github.event.schedule || '' }}"
          INPUT_TIER="${{ github.event.inputs.risk_tier || '' }}"

          if [ -n "$INPUT_TIER" ]; then
            RISK_TIER="$INPUT_TIER"
          elif [ "$SCHEDULE" = "30 0 * * *" ]; then
            RISK_TIER="tier1"
          elif [ "$SCHEDULE" = "0 1 * * 0" ]; then
            RISK_TIER="tier2"
          elif [ "$SCHEDULE" = "30 1 1 * *" ]; then
            RISK_TIER="tier3"
          else
            RISK_TIER="tier1"
          fi

          INPUT_SAMPLE="${{ github.event.inputs.sample || '' }}"
          if [ -n "$INPUT_SAMPLE" ]; then
            SAMPLE="$INPUT_SAMPLE"
          elif [ "$RISK_TIER" = "tier1" ]; then
            SAMPLE="50"
          elif [ "$RISK_TIER" = "tier2" ]; then
            SAMPLE="120"
          else
            SAMPLE="200"
          fi

          BATCH="${{ github.event.inputs.batch_size || '5' }}"

          npx tsx scripts/data-quality/select-risk-tier-sample.ts \
            --env "$ENV_FLAG" \
            --tier "$RISK_TIER" \
            --limit "$SAMPLE" \
            --out .ci-artifacts/reconcile/risk-tier-sample.json \
            | tee .ci-artifacts/reconcile/risk-tier.log

          {
            echo "env=$ENV_FLAG"
            echo "schedule=$SCHEDULE"
            echo "risk_tier=$RISK_TIER"
            echo "sample=$SAMPLE"
            echo "batch_size=$BATCH"
            echo "sha=${{ github.sha }}"
          } > .ci-artifacts/reconcile/metadata.txt

          npx tsx scripts/reconcile-attributes.ts \
            --env "$ENV_FLAG" \
            --sample "$SAMPLE" \
            --risk-tier "$RISK_TIER" \
            --sample-file .ci-artifacts/reconcile/risk-tier-sample.json \
            --batch-size "$BATCH" \
            | tee .ci-artifacts/reconcile/reconcile-output.log

      - name: Upload drift SQL artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attribute-drift-sql
          path: data/reconcile/*.sql
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reconcile-log
          path: .ci-artifacts/reconcile/reconcile-output.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload risk-tier log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reconcile-risk-tier-log
          path: .ci-artifacts/reconcile/risk-tier.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload risk-tier sample
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reconcile-risk-tier-sample
          path: .ci-artifacts/reconcile/risk-tier-sample.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload reconcile metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reconcile-metadata
          path: .ci-artifacts/reconcile/metadata.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Capture post-reconcile perf baseline
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          ENV_FLAG="${{ github.event.inputs.env || 'production' }}"

          npx tsx scripts/data-quality/perf-baseline.ts \
            --env "$ENV_FLAG" \
            --out .ci-artifacts/reconcile/perf-baseline-post.md \
            | tee .ci-artifacts/reconcile/perf-baseline-post.log

      - name: Upload pre-reconcile perf baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reconcile-perf-baseline-pre
          path: |
            .ci-artifacts/reconcile/perf-baseline-pre.md
            .ci-artifacts/reconcile/perf-baseline-pre.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload post-reconcile perf baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reconcile-perf-baseline-post
          path: |
            .ci-artifacts/reconcile/perf-baseline-post.md
            .ci-artifacts/reconcile/perf-baseline-post.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarize perf baseline deltas
        if: always()
        run: |
          set -o pipefail
          node <<'NODE' | tee .ci-artifacts/reconcile/perf-baseline-delta.log
          const fs = require('node:fs')

          const prePath = '.ci-artifacts/reconcile/perf-baseline-pre.md'
          const postPath = '.ci-artifacts/reconcile/perf-baseline-post.md'
          const outPath = '.ci-artifacts/reconcile/perf-baseline-delta.md'

          function readFile(path) {
            return fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : ''
          }

          function escapeRegExp(value) {
            return value.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&')
          }

          function parseMetric(text, metric) {
            const escaped = escapeRegExp(metric)
            const threeCol = new RegExp(`\\|\\s*${escaped}\\s*\\|\\s*([^|\\n]+)\\|\\s*([^|\\n]+)\\|`, 'm')
            const twoCol = new RegExp(`\\|\\s*${escaped}\\s*\\|\\s*([^|\\n]+)\\|`, 'm')

            const threeMatch = text.match(threeCol)
            if (threeMatch) return threeMatch[1].trim()

            const twoMatch = text.match(twoCol)
            return twoMatch ? twoMatch[1].trim() : null
          }

          function toNumber(cell) {
            if (!cell) return null
            const normalized = cell.replaceAll(',', '')
            const match = normalized.match(/-?\\d+(?:\\.\\d+)?/)
            return match ? Number(match[0]) : null
          }

          function formatDelta(metric, preCell, postCell) {
            const preNum = toNumber(preCell)
            const postNum = toNumber(postCell)
            if (preNum === null || postNum === null) return '_n/a_'

            const delta = postNum - preNum
            const sign = delta > 0 ? '+' : ''
            if (preCell.includes('%') || postCell.includes('%') || metric === 'Coverage') {
              return `${sign}${delta.toFixed(2)}pp`
            }
            return `${sign}${delta.toFixed(2)}`
          }

          const preText = readFile(prePath)
          const postText = readFile(postPath)

          const missingInputs = preText.length === 0 || postText.length === 0
          if (missingInputs) {
            const lines = [
              '### Perf Baseline Delta',
              '',
              '- Baseline delta summary unavailable for this run (missing pre or post baseline file).',
            ]
            fs.writeFileSync(outPath, `${lines.join('\\n')}\\n`, 'utf8')
            console.log('[perf-baseline-delta] baseline files missing; wrote fallback summary')
            process.exit(0)
          }

          const metrics = [
            'Open disputes',
            'Critical errors (24h)',
            'LLM endpoint errors (24h)',
            'Games (24h)',
            'Win rate (24h)',
            'Data health score',
            'Coverage',
          ]

          const rows = metrics.map((metric) => {
            const preCell = parseMetric(preText, metric)
            const postCell = parseMetric(postText, metric)
            const deltaCell = formatDelta(metric, preCell, postCell)
            return {
              metric,
              preCell: preCell ?? '_n/a_',
              postCell: postCell ?? '_n/a_',
              deltaCell,
            }
          })

          const lines = [
            '### Perf Baseline Delta',
            '',
            '| Metric | Pre | Post | Delta |',
            '|--------|-----|------|-------|',
            ...rows.map((row) => `| ${row.metric} | ${row.preCell} | ${row.postCell} | ${row.deltaCell} |`),
          ]

          fs.writeFileSync(outPath, `${lines.join('\\n')}\\n`, 'utf8')
          console.log('[perf-baseline-delta] wrote .ci-artifacts/reconcile/perf-baseline-delta.md')
          NODE

          cat .ci-artifacts/reconcile/perf-baseline-delta.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload perf baseline delta summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reconcile-perf-baseline-delta
          path: |
            .ci-artifacts/reconcile/perf-baseline-delta.md
            .ci-artifacts/reconcile/perf-baseline-delta.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Generate weekly completeness report (Sundays + tier2 dispatch)
        if: |
          github.event.schedule == '0 1 * * 0' ||
          github.event.inputs.risk_tier == 'tier2'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          ENV_FLAG="${{ github.event.inputs.env || 'production' }}"
          mkdir -p .ci-artifacts/reconcile data/quality-reports

          npx tsx scripts/data-quality/weekly-report.ts \
            --env "$ENV_FLAG" \
            | tee .ci-artifacts/reconcile/weekly-report.log

      - name: Upload weekly quality report
        if: |
          always() &&
          (github.event.schedule == '0 1 * * 0' ||
           github.event.inputs.risk_tier == 'tier2')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-quality-report
          path: data/quality-reports/quality-*.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Reconcile summary
        if: always()
        run: |
          {
            echo "### Reconcile Artifacts"
            echo ""
            echo "- Artifact: attribute-drift-sql"
            echo "- Artifact: reconcile-log"
            echo "- Artifact: reconcile-risk-tier-log"
            echo "- Artifact: reconcile-risk-tier-sample"
            echo "- Artifact: reconcile-metadata"
            echo "- Artifact: reconcile-perf-baseline-pre"
            echo "- Artifact: reconcile-perf-baseline-post"
            echo "- Artifact: reconcile-perf-baseline-delta"
            if [[ "${{ github.event.schedule }}" == "0 1 * * 0" ]] || [[ "${{ github.event.inputs.risk_tier }}" == "tier2" ]]; then
              echo "- Artifact: weekly-quality-report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
