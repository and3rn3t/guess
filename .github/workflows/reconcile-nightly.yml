name: Nightly attribute reconciliation (DQ.6)

# Samples N random characters from production D1, re-runs the canonical
# enrichment LLM prompt against them, and appends every attribute-value
# difference to the `attribute_drift` table (migration 0037).
#
# This is the "nightly cron" that DQ.6's acceptance criterion calls for —
# Cloudflare Pages doesn't run cron triggers natively, and even if H.3's
# Cron Worker did, OpenAI calls aren't wired into the Worker env. GitHub
# Actions' scheduler is the practical cron substrate.

on:
  schedule:
    # Daily at 00:30 UTC. Sits 15 min after `real-data-aggregate.yml` so we
    # don't contend on the same wrangler API token rate-limits.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
      sample:
        description: "Sample size (random characters)"
        required: false
        default: "50"
      batch_size:
        description: "Characters per LLM call"
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: reconcile-${{ github.event.inputs.env || 'production' }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Prepare reconcile artifacts
        run: mkdir -p .ci-artifacts/reconcile

      - name: Verify required secrets exist
        uses: ./.github/actions/verify-secrets
        with:
          names: OPENAI_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run nightly reconciliation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          ENV_FLAG="${{ github.event.inputs.env || 'production' }}"
          SAMPLE="${{ github.event.inputs.sample || '50' }}"
          BATCH="${{ github.event.inputs.batch_size || '5' }}"
          {
            echo "env=$ENV_FLAG"
            echo "sample=$SAMPLE"
            echo "batch_size=$BATCH"
            echo "sha=${{ github.sha }}"
          } > .ci-artifacts/reconcile/metadata.txt
          npx tsx scripts/reconcile-attributes.ts \
            --env "$ENV_FLAG" \
            --sample "$SAMPLE" \
            --batch-size "$BATCH" \
            | tee .ci-artifacts/reconcile/reconcile-output.log

      - name: Upload drift SQL artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attribute-drift-sql
          path: data/reconcile/*.sql
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reconcile-log
          path: .ci-artifacts/reconcile/reconcile-output.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload reconcile metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reconcile-metadata
          path: .ci-artifacts/reconcile/metadata.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Reconcile summary
        if: always()
        run: |
          {
            echo "### Reconcile Artifacts"
            echo ""
            echo "- Artifact: attribute-drift-sql"
            echo "- Artifact: reconcile-log"
            echo "- Artifact: reconcile-metadata"
          } >> "$GITHUB_STEP_SUMMARY"
