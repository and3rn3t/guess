name: Reusable Cloudflare Command

on:
  workflow_call:
    inputs:
      command:
        description: Shell command to run with Cloudflare credentials available.
        required: true
        type: string
      timeout-minutes:
        description: Job timeout in minutes.
        required: false
        default: 20
        type: number
      require-openai-key:
        description: Whether OPENAI_API_KEY must be present.
        required: false
        default: false
        type: boolean
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      OPENAI_API_KEY:
        required: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup
      - name: Verify required secrets
        uses: ./.github/actions/verify-secrets
        with:
          names: CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify OPENAI_API_KEY
        if: ${{ inputs.require-openai-key }}
        uses: ./.github/actions/verify-secrets
        with:
          names: OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Run Cloudflare command
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          ${{ inputs.command }}
