name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/app-core/**'
      - 'packages/game-engine/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/app-core/**'
      - 'packages/game-engine/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check + guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      - name: Mobile typecheck
        run: |
          set -o pipefail
          mkdir -p .ci-artifacts/mobile-ci
          pnpm --filter @guess/mobile typecheck 2>&1 | tee .ci-artifacts/mobile-ci/typecheck.log

      - name: Mobile guardrails
        run: |
          set -o pipefail
          pnpm mobile:guardrails 2>&1 | tee .ci-artifacts/mobile-ci/guardrails.log

      - name: Mobile reliability and perf gate
        run: |
          set -o pipefail
          pnpm mobile:reliability-gate 2>&1 | tee .ci-artifacts/mobile-ci/reliability-perf-gate.log

      - name: Resolve scorecard base ref (main pushes)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          base_sha="${{ github.event.before }}"

          if [[ -n "$base_sha" && "$base_sha" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --prune --depth=1 origin "$base_sha" || true
            echo "MOBILE_SCORECARD_BASE_REF=$base_sha" >> "$GITHUB_ENV"
            echo "Resolved scorecard base ref: $base_sha"
          else
            echo "No explicit base SHA available from event payload; using default scorecard base ref logic."
          fi

      - name: Mobile scorecard milestone gate (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -o pipefail
          pnpm mobile:scorecard:milestone 2>&1 | tee .ci-artifacts/mobile-ci/scorecard-milestone.log

      - name: Mobile scorecard production gate telemetry (main, warn-only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -o pipefail
          if pnpm mobile:scorecard:production 2>&1 | tee .ci-artifacts/mobile-ci/scorecard-production.log; then
            echo "production gate: pass" > .ci-artifacts/mobile-ci/scorecard-production-status.txt
          else
            echo "production gate: fail (warn-only rollout)" > .ci-artifacts/mobile-ci/scorecard-production-status.txt
            echo "::warning::Mobile production scorecard gate did not pass (warn-only rollout). See scorecard-production.log"
          fi

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-ci-${{ github.run_id }}
          path: .ci-artifacts/mobile-ci/
          if-no-files-found: ignore

      - name: Step summary
        if: always()
        run: |
          echo "## Mobile CI" >> $GITHUB_STEP_SUMMARY
          echo "- typecheck.log" >> $GITHUB_STEP_SUMMARY
          echo "- guardrails.log" >> $GITHUB_STEP_SUMMARY
          echo "- reliability-perf-gate.log" >> $GITHUB_STEP_SUMMARY
          echo "- scorecard-milestone.log (main pushes only)" >> $GITHUB_STEP_SUMMARY
          echo "- scorecard-production.log (main pushes only, warn-only)" >> $GITHUB_STEP_SUMMARY
          echo "- scorecard-production-status.txt" >> $GITHUB_STEP_SUMMARY

  eas-build:
    name: EAS Build (preview)
    runs-on: ubuntu-latest
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup

      - name: Check EXPO_TOKEN availability
        id: expo-token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -n "${EXPO_TOKEN:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is configured; EAS preview build enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping EAS preview build because EXPO_TOKEN is not configured."
          fi

      - name: Setup Expo + EAS CLI
        if: steps.expo-token.outputs.enabled == 'true'
        run: npm install --global eas-cli@latest

      - name: EAS Build — iOS preview
        if: steps.expo-token.outputs.enabled == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform ios \
            --profile preview \
            --non-interactive \
            --no-wait
