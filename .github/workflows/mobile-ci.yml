name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/app-core/**'
      - 'packages/game-engine/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/app-core/**'
      - 'packages/game-engine/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check + guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup

      - name: Mobile typecheck
        run: |
          set -o pipefail
          mkdir -p .ci-artifacts/mobile-ci
          pnpm --filter @guess/mobile typecheck 2>&1 | tee .ci-artifacts/mobile-ci/typecheck.log

      - name: Mobile guardrails
        run: |
          set -o pipefail
          pnpm mobile:guardrails 2>&1 | tee .ci-artifacts/mobile-ci/guardrails.log

      - name: Mobile scorecard milestone gate (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -o pipefail
          pnpm mobile:scorecard:milestone 2>&1 | tee .ci-artifacts/mobile-ci/scorecard-milestone.log

      - name: Mobile scorecard production gate telemetry (main, warn-only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -o pipefail
          if pnpm mobile:scorecard:production 2>&1 | tee .ci-artifacts/mobile-ci/scorecard-production.log; then
            echo "production gate: pass" > .ci-artifacts/mobile-ci/scorecard-production-status.txt
          else
            echo "production gate: fail (warn-only rollout)" > .ci-artifacts/mobile-ci/scorecard-production-status.txt
            echo "::warning::Mobile production scorecard gate did not pass (warn-only rollout). See scorecard-production.log"
          fi

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-ci-${{ github.run_id }}
          path: .ci-artifacts/mobile-ci/
          if-no-files-found: ignore

      - name: Step summary
        if: always()
        run: |
          echo "## Mobile CI" >> $GITHUB_STEP_SUMMARY
          echo "- typecheck.log" >> $GITHUB_STEP_SUMMARY
          echo "- guardrails.log" >> $GITHUB_STEP_SUMMARY
          echo "- scorecard-milestone.log (main pushes only)" >> $GITHUB_STEP_SUMMARY
          echo "- scorecard-production.log (main pushes only, warn-only)" >> $GITHUB_STEP_SUMMARY
          echo "- scorecard-production-status.txt" >> $GITHUB_STEP_SUMMARY

  eas-build:
    name: EAS Build (preview)
    runs-on: ubuntu-latest
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup

      - name: Setup Expo + EAS CLI
        run: pnpm add -g eas-cli@latest

      - name: EAS Build — iOS preview
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform ios \
            --profile preview \
            --non-interactive \
            --no-wait
