name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/app-core/**'
      - 'packages/game-engine/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/app-core/**'
      - 'packages/game-engine/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    name: Type-check + guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      - name: Mobile typecheck
        run: |
          set -o pipefail
          mkdir -p .ci-artifacts/mobile-ci
          pnpm --filter @guess/mobile typecheck 2>&1 | tee .ci-artifacts/mobile-ci/typecheck.log

      - name: Mobile guardrails
        run: |
          set -o pipefail
          pnpm mobile:guardrails 2>&1 | tee .ci-artifacts/mobile-ci/guardrails.log

      - name: Mobile evidence links gate
        run: |
          set -o pipefail
          pnpm mobile:evidence-links 2>&1 | tee .ci-artifacts/mobile-ci/evidence-links.log

      - name: Mobile reliability and perf gate
        run: |
          set -o pipefail
          pnpm mobile:reliability-gate 2>&1 | tee .ci-artifacts/mobile-ci/reliability-perf-gate.log

      - name: Upload static check logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-ci-checks-${{ github.run_id }}
          path: .ci-artifacts/mobile-ci/
          if-no-files-found: ignore

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Mobile CI — Static Checks"
            echo ""
            status() { [ -f "$1" ] && echo "✅" || echo "❌"; }
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Type-check | $(status .ci-artifacts/mobile-ci/typecheck.log) |"
            echo "| Guardrails | $(status .ci-artifacts/mobile-ci/guardrails.log) |"
            echo "| Evidence links | $(status .ci-artifacts/mobile-ci/evidence-links.log) |"
            echo "| Reliability gate | $(status .ci-artifacts/mobile-ci/reliability-perf-gate.log) |"
            echo ""
            echo "Artifact: \`mobile-ci-checks-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [checks]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      - name: Build web preview for mobile E2E lane
        run: |
          set -o pipefail
          mkdir -p .ci-artifacts/mobile-ci
          pnpm build:fast 2>&1 | tee .ci-artifacts/mobile-ci/build-fast.log

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Mobile core flow E2E lane
        run: |
          set -o pipefail
          pnpm test:e2e:mobile 2>&1 | tee .ci-artifacts/mobile-ci/mobile-core-flow-e2e.log
          mkdir -p .ci-artifacts/mobile-ci/e2e
          cp -R playwright-report .ci-artifacts/mobile-ci/e2e/playwright-report || true
          cp -R test-results .ci-artifacts/mobile-ci/e2e/test-results || true

      - name: Resolve scorecard base ref (main pushes)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          base_sha="${{ github.event.before }}"

          if [[ -n "$base_sha" && "$base_sha" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --prune --depth=1 origin "$base_sha" || true
            echo "MOBILE_SCORECARD_BASE_REF=$base_sha" >> "$GITHUB_ENV"
            echo "Resolved scorecard base ref: $base_sha"
          else
            echo "No explicit base SHA available from event payload; using default scorecard base ref logic."
          fi

      - name: Mobile scorecard milestone gate (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -o pipefail
          pnpm mobile:scorecard:milestone 2>&1 | tee .ci-artifacts/mobile-ci/scorecard-milestone.log

      - name: Mobile scorecard production gate telemetry (main, warn-only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -o pipefail
          if pnpm mobile:scorecard:production 2>&1 | tee .ci-artifacts/mobile-ci/scorecard-production.log; then
            echo "production gate: pass" > .ci-artifacts/mobile-ci/scorecard-production-status.txt
          else
            echo "production gate: fail (warn-only rollout)" > .ci-artifacts/mobile-ci/scorecard-production-status.txt
            echo "::warning::Mobile production scorecard gate did not pass (warn-only rollout). See scorecard-production.log"
          fi

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-ci-e2e-${{ github.run_id }}
          path: .ci-artifacts/mobile-ci/
          if-no-files-found: ignore

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Mobile CI — E2E"
            echo ""
            status() { [ -f "$1" ] && echo "✅" || echo "❌"; }
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Build | $(status .ci-artifacts/mobile-ci/build-fast.log) |"
            echo "| E2E tests | $(status .ci-artifacts/mobile-ci/mobile-core-flow-e2e.log) |"
            if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
              echo "| Scorecard milestone | $(status .ci-artifacts/mobile-ci/scorecard-milestone.log) |"
              PROD_STATUS="⚠️ not run"
              [ -f .ci-artifacts/mobile-ci/scorecard-production-status.txt ] && \
                PROD_STATUS="$(cat .ci-artifacts/mobile-ci/scorecard-production-status.txt)"
              echo "| Scorecard production | $PROD_STATUS |"
            fi
            echo ""
            echo "Artifact: \`mobile-ci-e2e-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  eas-build:
    name: EAS Build (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup

      - name: Check EXPO_TOKEN availability
        id: expo-token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -n "${EXPO_TOKEN:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is configured; EAS preview build enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping EAS preview build because EXPO_TOKEN is not configured."
          fi

      - name: Check EAS project configuration
        id: eas-project
        run: |
          set -euo pipefail

          has_eas_json=false
          has_project_id=false

          if [[ -f apps/mobile/eas.json ]]; then
            has_eas_json=true
          fi

          if grep -q '"projectId"' apps/mobile/app.json; then
            has_project_id=true
          fi

          if [[ "$has_eas_json" == true && "$has_project_id" == true ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "EAS project configuration detected."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping EAS preview build because EAS project is not configured (need apps/mobile/eas.json and expo.extra.eas.projectId in apps/mobile/app.json)."
          fi

      - name: Setup Expo + EAS CLI
        if: steps.expo-token.outputs.enabled == 'true' && steps.eas-project.outputs.enabled == 'true'
        run: npm install --global eas-cli@latest

      - name: EAS Build — iOS preview
        if: steps.expo-token.outputs.enabled == 'true' && steps.eas-project.outputs.enabled == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform ios \
            --profile preview \
            --non-interactive \
            --no-wait
